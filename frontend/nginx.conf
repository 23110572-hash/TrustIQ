server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve .jsx files as JavaScript so Babel-standalone can fetch them.
    location ~ \.jsx$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
